<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#00629B">
  <title>Risk It · Team</title>
  <link rel="icon" href="assets/ieee-uob-logo.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body class="screen-team">
  <header class="app-header">
    <div class="app-header__inner container">
      <div class="brand">
        <img class="brand__logo" src="assets/ieee-uob-logo.png" alt="IEEE UOB Student Branch">
        <span class="brand__divider" aria-hidden="true"></span>
        <span class="brand__title">Risk It</span>
      </div>
      <div class="header-meta" id="meta"></div>
    </div>
  </header>

  <main class="team-main hero-bg" id="app">
    <div class="container team-layout">
      <section class="team-stage" id="stage" aria-live="polite">
        <div class="card card--glass card--pad-lg notice"><span class="spinner"></span></div>
      </section>
      <aside class="team-side hidden" id="side">
        <h2 class="overline">Leaderboard</h2>
        <ol class="lb lb--compact" id="leaderboard"></ol>
      </aside>
    </div>
  </main>

  <div class="overlay hidden" id="paused">
    <div class="card card--elevated card--pad-lg overlay__card">
      <p class="overline" style="color:var(--color-brand)">Game paused</p>
      <h2 class="h1">Hold on…</h2>
      <p class="muted">The game master paused the game. Your timer is frozen.</p>
    </div>
  </div>

  <script type="module" src="js/team.js"></script>
</body>
</html>
