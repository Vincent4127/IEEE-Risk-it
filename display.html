<body class="screen-display">
  <header class="app-header">
    <div class="app-header__inner container container--wide">
      <div class="brand">
        <img class="brand__logo" src="assets/ieee-uob-logo.png" alt="IEEE UOB Student Branch">
        <span class="brand__divider" aria-hidden="true"></span>
        <span class="brand__title">Risk It</span>
      </div>
      <div class="header-meta" id="meta"></div>
      <div class="header-tools">
        <button class="tool-btn" id="soundBtn" type="button"></button>
        <button class="tool-btn" id="fullBtn" type="button"></button>
      </div>
    </div>
  </header>

  <main class="display-main hero-bg" id="app">
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="sidebar">
      <div class="sidebar__head">
        <h2 class="overline">Leaderboard</h2>
      </div>
      <ol class="lb" id="leaderboard"></ol>
    </aside>
  </main>

  <div class="overlay hidden" id="paused">
    <div class="card card--elevated card--pad-lg overlay__card">
      <p class="overline" style="color:var(--color-brand)">Game paused</p>
      <h2 class="h1">Hold on…</h2>
      <p class="muted">The game master paused the game. It will continue shortly.</p>
    </div>
  </div>

  <div class="owner-banner hidden" id="ownerBanner">
    <span>Another Main Display is running the game. This one is view-only.</span>
    <button class="btn btn--sm btn--inverse" id="takeOver" type="button">Take over</button>
  </div>

  <div class="login-wrap hero-bg hidden" id="login"></div>
